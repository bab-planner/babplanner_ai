[project]
name = "babplanner-ai"
version = "0.1.0"
description = "밥플래너 AI 서비스 (다음 운영일 중식 식수 인원 예측)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
# CCTV counting 연구 트랙 전용. FastAPI 서비스는 이것 없이 그대로 뜬다.
# research/cctv_counting/src 의 core 로직(기하, 추적, 계수, 지표)은 표준
# 라이브러리만 쓰므로 이 extra 없이도 import 되고 테스트된다. 여기 있는
# 것들은 영상 입출력과 pretrained detector 추론에만 필요하다.
cctv = [
    "pyyaml>=6.0",          # 실험 config 파일 파싱
    "opencv-python>=4.10",  # 영상 디코딩과 annotated.mp4 인코딩
    "numpy>=1.26",          # detector 입출력 프레임 배열
    "torch>=2.4",           # torchvision detector backend
    "torchvision>=0.19",    # COCO pretrained person detector (BSD-3-Clause)
    "httpx>=0.27",          # demo collector -> Spring. dev extra에 이미 있는 것을 재사용한다
]
# 식수 예측 모델 artifact(joblib으로 저장한 sklearn Pipeline)를 **읽는** 데만
# 필요하다. 학습은 research/demand_forecasting 에서 한다. 이 extra가 없어도
# 서비스는 뜨고, 수요 예측 status가 unavailable, predict가 503이 된다.
# 버전은 artifact를 저장한 환경과 정확히 맞춘다. pickle은 라이브러리 버전이
# 다르면 조용히 다르게 동작하거나 깨질 수 있다. artifact를 다시 학습하면
# research/demand_forecasting/models/metadata.json 의 versions 와 함께 올린다.
demand-model = [
    "joblib==1.5.3",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
    "lightgbm==4.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 서비스 테스트와 연구 트랙 테스트, 그리고 demo collector 테스트를 같은
# `pytest` 한 번으로 돌린다. 어느 한쪽이 다른 쪽을 깨뜨리면 그 자리에서
# 보이게 하려는 것이다.
#
# collector의 계수/정책/전송 로직은 torch와 opencv 없이 import된다.
# 영상 디코딩만 opencv를 쓰고, 그 import는 함수 안에 있다.
testpaths = [
    "tests",
    "research/cctv_counting/tests",
    "research/waste_estimation/tests",
    "demo/cctv_collector/tests",
]
pythonpath = [
    "src",
    "research/cctv_counting/src",
    "research/waste_estimation/src",
    "demo/cctv_collector/src",
]
