[project]
name = "babplanner-ai"
version = "0.1.0"
description = "밥플래너 잔반 이미지 분석 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
# CCTV counting 연구 트랙 전용. FastAPI 서비스는 이것 없이 그대로 뜬다.
# research/cctv_counting/src 의 core 로직(기하, 추적, 계수, 지표)은 표준
# 라이브러리만 쓰므로 이 extra 없이도 import 되고 테스트된다. 여기 있는
# 것들은 영상 입출력과 pretrained detector 추론에만 필요하다.
cctv = [
    "pyyaml>=6.0",          # 실험 config 파일 파싱
    "opencv-python>=4.10",  # 영상 디코딩과 annotated.mp4 인코딩
    "numpy>=1.26",          # detector 입출력 프레임 배열
    "torch>=2.4",           # torchvision detector backend
    "torchvision>=0.19",    # COCO pretrained person detector (BSD-3-Clause)
    "httpx>=0.27",          # demo collector -> Spring. dev extra에 이미 있는 것을 재사용한다
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 서비스 테스트와 연구 트랙 테스트, 그리고 demo collector 테스트를 같은
# `pytest` 한 번으로 돌린다. 어느 한쪽이 다른 쪽을 깨뜨리면 그 자리에서
# 보이게 하려는 것이다.
#
# collector의 계수/정책/전송 로직은 torch와 opencv 없이 import된다.
# 영상 디코딩만 opencv를 쓰고, 그 import는 함수 안에 있다.
testpaths = [
    "tests",
    "research/cctv_counting/tests",
    "demo/cctv_collector/tests",
]
pythonpath = [
    "src",
    "research/cctv_counting/src",
    "demo/cctv_collector/src",
]
