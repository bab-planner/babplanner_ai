# Stage A2 — 진단 실험. tracker 파라미터의 fps 의존성 확인.
#
# 대상 영상: opencv/opencv samples/data/vtest.avi
#   768x576, 10 fps, 795 frames, 79.5초
#   보행자 통로를 내려다보는 고정 카메라
#
# **급식소 영상이 아니다.** 사람이 선을 넘는 것을 세는 기계가 실제로 도는지
# 보기 위한 대리 장면이다. 여기서 나온 숫자를 급식소 성능으로 옮겨 말하지
# 않는다.
#
# ROI와 선은 정답을 보기 전에 화면을 눈으로 확인하고 정했다. 성능을 높이려고
# 나중에 옮기지 않는다. 정답도 같은 선과 같은 ROI 기준으로 센다.

name: a2_demo_tracking_fpsfix
description: 진단용. max_age/min_hits를 10fps에 맞춰 환산한 것 외에는 동일.

detector:
  backend: torchvision
  model: fasterrcnn_mobilenet_v3_large_fpn
  confidence_threshold: 0.5
  device: auto
  person_class_id: null
  max_input_size: null   # 768x576은 이미 작다. 줄이면 원거리 사람을 더 놓친다.

tracker:
  enabled: true
  high_threshold: 0.5
  low_threshold: 0.1
  iou_threshold: 0.3
  low_iou_threshold: 0.2
  # 기본값이 의도한 시간(1.0초 / 0.1초)을 10fps로 환산한 값.
  # **성능을 높이려고 고른 값이 아니다.** 프레임 단위 파라미터가 fps에 따라
  # 뜻이 달라진다는 것을 실제로 확인하기 위한 진단용이고, 주 baseline은
  # a2_demo_tracking.yaml 쪽이다.
  max_age: 10
  min_hits: 1

roi:
  # 포장된 통로만 본다. 위쪽 먼 건물과 아래쪽 잔디 앞마당은 뺀다.
  # 정답 annotation도 이 사각형 기준으로 센다.
  enabled: true
  x1: 0.02
  y1: 0.22
  x2: 0.98
  y2: 0.78

line:
  enabled: true
  # 세로선. 이 장면에서 사람은 좌우로 지나가므로 가로선은 거의 넘지 않는다.
  start: [0.72, 0.22]
  end: [0.72, 0.78]
  # start -> end 가 아래 방향이므로, 선 왼쪽이 POSITIVE다.
  # IN = 왼쪽으로 넘어가는 것(통로 안쪽 방향)으로 정한다.
  # 이 장면에 "입구"라는 것이 실제로 있는 것은 아니고, 정답과 예측이 같은
  # 규칙을 쓰기만 하면 된다.
  in_direction: POSITIVE
  anchor: BOTTOM_CENTER
  band: 0.01
  min_confirm_distance: 0.03
  cooldown_seconds: 0.5   # 10fps에서 5프레임

reliability:
  min_mean_confidence: 0.45

window:
  enabled: true
  seconds: 3.0

output:
  annotated_video: true
  observations_csv: true
  summary_json: true
  windows_csv: true

seed: 0
frame_stride: 1
