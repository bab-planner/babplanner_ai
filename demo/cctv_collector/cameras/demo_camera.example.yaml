# 카메라 한 대의 설정 예시.
#
# **비밀 값을 여기에 두지 않는다.** 백엔드 주소와 내부 서비스 토큰은
# 환경 변수(BAPPLANNER_BACKEND_BASE_URL / BAPPLANNER_INTERNAL_SERVICE_TOKEN)
# 로만 들어온다. 이 파일에 token 같은 키가 있으면 수집기가 기동을 거부한다.
#
# **영상 경로도 여기에 두지 않는다.** `--video` 로 준다. 개인 PC의 절대
# 경로가 저장소에 들어가지 않게 하려는 것이다.

# 어느 식당인가. 백엔드 dining_sites의 id다.
# **추측하지 않는다.** 실제 DB나 API에서 확인한 값을 넣는다.
site_id: 1

# 관측 장비 식별자. 사람이 아니라 카메라를 가리킨다.
device_id: demo-cctv-01

# 판정 모델 버전. 연구를 과장하는 이름을 쓰지 않는다.
model_version: cctv-fasterrcnn-mobilenetv3-demo-v1

# ROI와 선이 정규화 좌표(0~1)이므로 프레임 크기를 알아야 한다.
frame:
  width: 384
  height: 288

# ---------------------------------------------------------------------------
# 카메라 보정
# ---------------------------------------------------------------------------
# **이 두 값은 카메라마다 다르다.** A6에서 확인한 것이 이것이다 — 카메라를
# 바꿨는데 ROI를 그대로 썼더니 정답 통과 사건의 23%가 계수 영역 밖에서
# 일어났다. tracker를 바꾸는 것보다 이쪽이 영향이 컸다.
#
# 새 카메라를 달면 먼저 확인한다:
#   python -m cctv_collector --video x.mp4 --config this.yaml --preview-frame 100
# 초록 사각형이 ROI, 빨간 선이 counting line이다.

roi:
  enabled: true
  x1: 0.0
  y1: 0.20
  x2: 1.0
  y2: 0.95

line:
  # 화면을 가로지르는 세로선. 사람이 이 선을 넘는 것을 입장/퇴장으로 센다.
  start: [0.5, 0.20]
  end: [0.5, 0.95]

  # 어느 쪽으로 넘는 것이 입장인가. 카메라 설치 방향이 정한다.
  # POSITIVE = 오른쪽에서 왼쪽. 현장에서 반드시 눈으로 확인한다.
  in_direction: POSITIVE

  # 상자의 어느 점으로 판정하는가. 바닥에 그은 선이면 발쪽이 맞다.
  anchor: BOTTOM_CENTER

  # 선 위 미세한 떨림을 무시하는 폭, 확정에 필요한 거리, 재계수 금지 시간.
  band: 0.01
  min_confirm_distance: 0.03
  cooldown_seconds: 0.5

# ---------------------------------------------------------------------------
# 관측 표본
# ---------------------------------------------------------------------------
# 25fps 영상이라고 초당 25번 POST하지 않는다. 혼잡도는 초 단위로 뒤집히는
# 값이 아니고, 백엔드는 관측마다 이력과 현재값 두 테이블에 쓴다.
observation:
  interval_seconds: 1.0
  # latest = 창의 마지막 표본, median = 창 표본의 중앙값(낮은 쪽).
  # 둘 다 연구가 정의한 occupancy를 변형하지 않는 단순 정책이다.
  aggregation: latest

# ---------------------------------------------------------------------------
# 혼잡도 단계 정책
# ---------------------------------------------------------------------------
# **이것은 AI 출력이 아니다.** 연구가 정의한 것은 peopleCount까지다.
# 몇 명부터 붐비는지는 그 식당의 좌석 수와 회전율이 정하고, 측정된 적이 없다.
#
# 아래 숫자는 **시연을 위해 사람이 임의로 고른 값이다.**
# 실제 급식소에서 보정한 값이 아니며, 운영 기준으로 인용하면 안 된다.
# 그 사실이 주석이 아니라 calibration 필드로 함께 저장된다.
#
# 이 블록이 없으면 --send 가 거부된다. dry-run은 이것 없이도 돈다.
congestion_policy:
  type: count_thresholds
  calibration: DEMO_ONLY_UNCALIBRATED
  comfortable_max: 5   # 0~5명   -> COMFORTABLE
  normal_max: 12       # 6~12명  -> NORMAL
  crowded_max: 20      # 13~20명 -> CROWDED
                       # 21명~   -> VERY_CROWDED
